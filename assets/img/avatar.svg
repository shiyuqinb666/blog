<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="余烬之光头像">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2030"/>
      <stop offset="55%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0e1119"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c8cff"/>
      <stop offset="100%" stop-color="#35d6c4"/>
    </linearGradient>
    <linearGradient id="g2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7ba8"/>
      <stop offset="100%" stop-color="#ffc46b"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="22%" r="72%">
      <stop offset="0%" stop-color="#7c8cff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#7c8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="240" height="240" rx="44" fill="url(#bg)"/>
  <rect width="240" height="240" rx="44" fill="url(#glow)"/>

  <!-- 轨道 -->
  <g fill="none" stroke-linecap="round">
    <ellipse cx="120" cy="122" rx="86" ry="40" transform="rotate(-22 120 122)"
             stroke="url(#g1)" stroke-width="2.5" opacity=".72"/>
    <ellipse cx="120" cy="122" rx="62" ry="86" transform="rotate(28 120 122)"
             stroke="url(#g2)" stroke-width="2" opacity=".55"/>
    <circle cx="120" cy="122" r="52" stroke="#2a3142" stroke-width="1.5" opacity=".9"/>
  </g>

  <!-- 星点 -->
  <g fill="#e8ecf4">
    <circle cx="196" cy="70" r="3.4" opacity=".95"/>
    <circle cx="44" cy="166" r="2.6" opacity=".7"/>
    <circle cx="176" cy="188" r="2" opacity=".55"/>
    <circle cx="58" cy="62" r="1.8" opacity=".5"/>
  </g>

  <!-- 字 -->
  <text x="120" y="141" text-anchor="middle" font-size="82"
        font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans SC, sans-serif"
        font-weight="700" fill="#f2f5fb">余</text>
</svg>
